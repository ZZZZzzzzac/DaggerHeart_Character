<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>匕首之心角色卡</title>
<style>
:root {
  --bg: #0e1117; --card: #161b22; --border: #30363d;
  --text: #c9d1d9; --dim: #6e7681; --white: #e6edf3;
  --hope: #3fb950; --fear: #f85149; --crit: #d2a8ff;
  --accent: #58a6ff; --gold: #e3b341; --stress: #f0883e;
  --hover: #21262d; --input-bg: #0d1117;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono: "Cascadia Code","Fira Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;padding:8px;padding-bottom:60px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── layout ── */
.sheet{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.section{background:var(--card);padding:10px 12px}
.section-title{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;-webkit-user-select:none;user-select:none}

/* ── header ── */
.header{display:flex;align-items:center;gap:12px;padding:14px 12px;background:linear-gradient(180deg,#161b22,#0d1117)}
.avatar{width:52px;height:52px;border-radius:6px;border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim);background:#000;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.char-name{font-size:18px;font-weight:700;color:#fff}
.char-sub{font-size:11px;color:var(--dim)}

/* ── grid helpers ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border)}
.cell{background:var(--card);padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell-h{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:6px 8px}
.cell-label{font-size:10px;color:var(--dim);white-space:nowrap}
.cell-val{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--white);cursor:pointer;min-width:20px;text-align:center}
.cell-val:hover{color:var(--accent)}
.attr-roll-btn{margin-top:2px;border:1px solid var(--border);border-radius:999px;background:var(--hover);color:var(--dim);padding:1px 8px;font-size:10px;cursor:pointer}
.attr-roll-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── resource row (hp / stress / armor / hope) ── */
.res-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.res-label{font-size:11px;color:var(--dim);min-width:48px}
.res-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:4px;background:var(--hover);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.res-btn:hover{border-color:var(--accent);color:var(--accent)}
.res-val{font-family:var(--mono);font-size:15px;font-weight:600;min-width:24px;text-align:center;cursor:pointer}
.res-val:hover{color:var(--accent)}
.res-hp .res-val{color:var(--fear)}
.res-stress .res-val{color:var(--stress)}
.res-armor .res-val{color:var(--accent)}
.res-hope .res-val{color:var(--hope)}

/* ── experience rows ── */
.exp-row{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(48,54,61,.4)}
.exp-name{flex:1;font-size:12px;cursor:pointer;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-name:hover{color:var(--accent)}
.exp-mod{font-family:var(--mono);font-size:12px;color:var(--hope);cursor:pointer;min-width:28px;text-align:right}
.exp-mod:hover{color:var(--accent)}
.exp-roll-btn{font-size:11px;color:var(--dim);cursor:pointer;padding:0 2px}
.exp-roll-btn:hover{color:var(--hope)}

/* ── weapon / armor block ── */
.equip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.equip-block{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;background:var(--input-bg)}
.equip-title{font-size:12px;font-weight:600;color:var(--white);margin-bottom:4px;cursor:pointer}
.equip-title:hover{color:var(--accent)}
.equip-line{font-size:11px;color:var(--dim);cursor:pointer;padding:1px 0}
.equip-line:hover{color:var(--text)}

/* ── gold ── */
.gold-row{display:flex;align-items:center;gap:8px}
.gold-icon{font-size:14px}
.gold-label{font-size:11px;color:var(--gold);min-width:40px}
.gold-val{font-family:var(--mono);font-size:14px;color:var(--gold);cursor:pointer}
.gold-val:hover{color:var(--accent)}

/* ── custom fields ── */
.custom-row{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(48,54,61,.4)}
.custom-key{font-size:12px;color:var(--text);cursor:pointer;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-key:hover{color:var(--accent)}
.custom-val{flex:1;font-size:12px;color:var(--dim);cursor:pointer;text-align:right;word-break:break-all}
.custom-val:hover{color:var(--accent)}
.custom-sep{font-size:12px;color:var(--dim)}
.custom-del{font-size:11px;color:var(--fear);cursor:pointer;opacity:.6;padding:0 2px}
.custom-del:hover{opacity:1}
.add-btn{font-size:11px;color:var(--accent);cursor:pointer;padding:4px 0;-webkit-user-select:none;user-select:none}
.add-btn:hover{text-decoration:underline}

/* ── dice panel ── */
.dice-section{padding:10px 12px}
.dice-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dice-btn{border:1px solid var(--border);border-radius:6px;background:var(--hover);color:var(--text);padding:6px 10px;cursor:pointer;font-size:12px;flex:1;min-width:70px;text-align:center}
.dice-btn:hover{border-color:var(--accent);color:var(--accent)}
.dice-btn.primary{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.4);color:var(--hope);font-weight:600}
.dice-btn.primary:hover{background:rgba(63,185,80,.22)}
.dice-mod-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px}
.dice-mod-row.center{justify-content:center}
.dice-mod-input{width:50px;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:3px 6px;font-size:12px;text-align:center}

/* ── inline editor ── */
.inline-edit{background:var(--input-bg);border:1px solid var(--accent);border-radius:3px;color:#fff;font-size:inherit;font-family:inherit;text-align:center;padding:1px 4px;outline:none}

/* ── misc ── */
.empty{padding:30px;text-align:center;color:var(--dim);font-style:italic}
.sep{height:1px;background:var(--border)}

/* ── modal overlay (for roll confirm) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;width:90%;max-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.modal-title{font-size:16px;font-weight:700;color:#fff;text-align:center;margin-bottom:12px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btn{border:1px solid var(--border);border-radius:6px;background:var(--hover);color:var(--text);padding:8px;cursor:pointer;font-size:12px;text-align:center}
.modal-btn:hover{border-color:var(--accent)}
.modal-btn.wide{grid-column:span 2}
.modal-btn.hope-btn{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:var(--hope);font-weight:600}
.modal-btn.hope-btn:hover{background:rgba(63,185,80,.2)}
.modal-cancel{width:100%;background:transparent;border:none;color:var(--dim);cursor:pointer;padding:8px 0;margin-top:8px;font-size:12px}
.modal-cancel:hover{color:#fff}

@media (max-width: 460px){
  .grid6{grid-template-columns:repeat(3,1fr)}
  .equip-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ╔══════════════════════════════════════════╗
     ║  SealChat 匕首之心 (Daggerheart) 角色卡  ║
     ╚══════════════════════════════════════════╝ -->

<div id="app"></div>

<!-- Roll confirm modal -->
<div id="rollModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">二元骰掷骰</div>
    <div class="dice-mod-row center">
      <span>额外调整值</span>
      <input id="modalMod" class="dice-mod-input" type="number" value="0"/>
    </div>
    <div class="modal-actions">
      <button class="modal-btn hope-btn wide" onclick="execRoll('')">掷骰</button>
      <button class="modal-btn" onclick="execRoll('adv')">优势 (adv)</button>
      <button class="modal-btn" onclick="execRoll('dis')">劣势 (dis)</button>
    </div>
    <button class="modal-cancel" onclick="closeRollModal()">取消</button>
  </div>
</div>

<script>
/* ================================================================
   0. SealChat Bridge (from official doc §4.1)
   ================================================================ */
var _windowId = null;
var _rollDispatchMode = 'default';

function postEvent(action, payload) {
  if (!_windowId) return;
  window.parent.postMessage({
    type: 'SEALCHAT_EVENT', version: 1,
    windowId: _windowId, action: action, payload: payload
  }, '*');
}

window.sealchat = {
  onUpdate: function(cb) {
    window.addEventListener('message', function(e) {
      if (e.source !== window.parent) return;
      if (e.data && e.data.type === 'SEALCHAT_UPDATE') {
        _windowId = e.data.payload.windowId;
        cb(e.data.payload);
      }
    });
  },
  setRollDispatchMode: function(mode) {
    _rollDispatchMode = mode === 'template' ? 'template' : 'default';
  },
  setRollMode: function(mode) {
    _rollDispatchMode = mode === 'template' ? 'template' : 'default';
  },
  roll: function(template, label, args) {
    postEvent('ROLL_DICE', {
      roll: { template: template, label: label || '', args: args || {}, dispatchMode: _rollDispatchMode }
    });
  },
  updateAttrs: function(attrs) {
    postEvent('UPDATE_ATTRS', { attrs: attrs });
  }
};

// Use template dispatch so we keep full control of dice results
window.sealchat.setRollDispatchMode('template');

/* ================================================================
   1. State
   ================================================================ */
var S = {
  name: '', avatarUrl: '', attrs: {},
  // derived / cached for rendering
};

// attrs key names — matching existing JSON convention
var ATTR_KEYS = {
  agility:  'AgilityTextbox',
  strength: 'StrengthTextbox',
  finesse:  'FinesseTextbox',
  instinct: 'InstinctTextbox',
  presence: 'PresenceTextbox',
  knowledge:'KnowledgeTextbox'
};
var ATTR_LABELS = {
  agility:'敏捷 AGI', strength:'力量 STR', finesse:'灵巧 FIN',
  instinct:'直觉 INS', presence:'风度 PRE', knowledge:'学识 KNO'
};

var RES_KEYS = {
  hp:      { cur: 'HpCurrent',       max: 'HpMax' },
  stress:  { cur: 'StressCurrent',   max: 'StressMax' },
  armor:   { cur: 'ArmorCurrent',    max: 'ArmorTextbox' },
  hope:    { cur: 'HopeCurrent',     max: 'HopeMax' }
};

var INFO_KEYS = {
  race:       'RaceTextbox',
  community:  'CommunityTextbox',
  class_:     'ClassTextbox',
  classDomain:'ClassDomainTextbox',
  level:      'LevelTextbox',
  evasion:    'EvasionTextbox',
  major:      'MajorTextbox',
  severe:     'SevereTextbox',
  classFeature:'ClassFeatureTextbox',
  itemSlot:   'ItemSlot1Textbox'
};

var EXP_COUNT = 5;
var WEAPON_SLOTS = ['Primary','Secondary','Backup1','Backup2'];
var GOLD_KEYS = { handful:'GoldHandful', bag:'GoldBag', chest:'GoldChest' };
var CUSTOM_KEY = '_customFields'; // JSON array stored as string in attrs

/* ================================================================
   2. Helpers
   ================================================================ */
function esc(t){ var d=document.createElement('div'); d.textContent=t==null?'':String(t); return d.innerHTML; }
function num(v){ var n=Number(v); return Number.isFinite(n)?n:0; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function a(key){ var v=S.attrs[key]; return v==null?'':String(v); }
function an(key){ return num(S.attrs[key]); }
function randInt(lo,hi){ return Math.floor(Math.random()*(hi-lo+1))+lo; }
function signed(n){ return (n >= 0 ? '+' : '') + n; }

function getCustomFields() {
  var raw = S.attrs[CUSTOM_KEY];
  if (!raw) return [];
  if (typeof raw === 'string') { try { return JSON.parse(raw); } catch(e){ return []; } }
  if (Array.isArray(raw)) return raw;
  return [];
}

function patchAttrs(patch) {
  for (var k in patch) S.attrs[k] = patch[k];
  if (window.sealchat && window.sealchat.updateAttrs) {
    window.sealchat.updateAttrs(patch);
  }
  render();
}

/* ================================================================
   3. Render
   ================================================================ */
function render() {
  var el = document.getElementById('app');
  if (!S.attrs || Object.keys(S.attrs).length === 0) {
    el.innerHTML = '<div class="empty">等待角色数据…</div>';
    return;
  }
  var h = '';

  // ── Header ──
  var av = S.avatarUrl;
  var avHtml = av ? '<img src="'+esc(av)+'">' : (esc((S.name||'?').charAt(0)));
  h += '<div class="sheet">';
  h += '<div class="header">';
  h += '  <div class="avatar">'+avHtml+'</div>';
  h += '  <div>';
  h += '    <div class="char-name" data-edit-key="NameTextbox">'+esc(a('NameTextbox')||S.name||'未命名')+'</div>';
  h += '    <div class="char-sub">'+esc(a(INFO_KEYS.race))+' · '+esc(a(INFO_KEYS.community))+'</div>';
  h += '    <div class="char-sub">'+esc(a(INFO_KEYS.class_))+' · '+esc(a(INFO_KEYS.classDomain))+'</div>';
  h += '  </div>';
  h += '</div>';

  // ── Level / Evasion / Thresholds ──
  h += '<div class="grid2">';
  h += cellV('等级', a(INFO_KEYS.level), INFO_KEYS.level);
  h += cellV('闪避', a(INFO_KEYS.evasion), INFO_KEYS.evasion);
  h += cellV('主伤阈值', a(INFO_KEYS.major), INFO_KEYS.major);
  h += cellV('重伤阈值', a(INFO_KEYS.severe), INFO_KEYS.severe);
  h += '</div>';

  // ── Six Attributes ──
  h += '<div class="section"><div class="section-title">属性 Attributes</div>';
  h += '<div class="grid6">';
  var order = ['agility','strength','finesse','instinct','presence','knowledge'];
  for (var i=0;i<order.length;i++) {
    var k = order[i];
    h += cellV(ATTR_LABELS[k], a(ATTR_KEYS[k]), ATTR_KEYS[k], k);
  }
  h += '</div></div>';

  // ── Resources ──
  h += '<div class="section"><div class="section-title">资源 Resources</div>';
  h += resRow('生命 HP', 'hp', 'res-hp');
  h += resRow('压力 Stress', 'stress', 'res-stress');
  h += resRow('护甲 Armor', 'armor', 'res-armor');
  h += resRow('希望 Hope', 'hope', 'res-hope');
  h += '</div>';

  // ── Experiences ──
  h += '<div class="section"><div class="section-title">经历 Experiences</div>';
  for (var i=1;i<=EXP_COUNT;i++) {
    var ek = 'Experience'+i+'Textbox';
    var mk = 'Experience'+i+'ModifierTextbox';
    var en = a(ek), em = a(mk);
    if (!en && !em && i > 3) continue; // hide empty optional slots
    h += '<div class="exp-row">';
    h += '  <span class="exp-name" data-edit-key="'+ek+'">'+esc(en||'(空)')+'</span>';
    h += '  <span class="exp-mod" data-edit-key="'+mk+'">'+esc(em||'+0')+'</span>';
    h += '  <span class="exp-roll-btn" data-roll-exp="'+i+'" title="用此经历掷骰">🎲</span>';
    h += '</div>';
  }
  h += '</div>';

  // ── Weapons & Armor ──
  h += '<div class="section"><div class="section-title">装备 Equipment</div>';
  h += '<div class="equip-grid">';
  h += equipBlock('Primary', '主武器');
  h += equipBlock('Secondary', '副武器');
  h += armorBlock();
  if (a('Backup1WeaponNameTextbox')) h += equipBlock('Backup1', '备用武器1');
  if (a('Backup2WeaponNameTextbox')) h += equipBlock('Backup2', '备用武器2');
  h += '</div>';
  // Items
  var items = a(INFO_KEYS.itemSlot);
  if (items) {
    h += '<div class="equip-block">';
    h += '  <div class="equip-title">物品栏</div>';
    h += '  <div class="equip-line" data-edit-key="'+INFO_KEYS.itemSlot+'" style="white-space:pre-wrap">'+esc(items)+'</div>';
    h += '</div>';
  }
  h += '</div>';

  // ── Gold ──
  h += '<div class="section"><div class="section-title">金币 Gold</div>';
  h += '<div style="display:flex;gap:16px;flex-wrap:wrap">';
  h += goldCell('🪙','一把',GOLD_KEYS.handful);
  h += goldCell('💰','一袋',GOLD_KEYS.bag);
  h += goldCell('📦','一箱',GOLD_KEYS.chest);
  h += '</div></div>';

  // ── Class Feature (collapsed) ──
  var cf = a(INFO_KEYS.classFeature);
  if (cf) {
    h += '<div class="section"><div class="section-title">职业特性 Class Features</div>';
    h += '<div style="font-size:12px;color:var(--dim);white-space:pre-wrap;cursor:pointer" data-edit-key="'+INFO_KEYS.classFeature+'">'+esc(cf)+'</div>';
    h += '</div>';
  }

  // ── Custom Fields ──
  h += '<div class="section"><div class="section-title">自定义字段 Custom Fields</div>';
  var cfs = getCustomFields();
  for (var i=0;i<cfs.length;i++) {
    h += '<div class="c把stom-row">';
    h += '  <span class="custom-key" data-custom-idx="'+i+'" data-custom-part="key">“'+esc(cfs[i].k||'自定义字段')+'”</span>';
    h += '  <span class="custom-sep">：</span>';
    h += '  <span class="custom-val" data-custom-idx="'+i+'" data-custom-part="val">“'+esc(cfs[i].v||'自定义值')+'”</span>';
    h += '  <span class="custom-del" data-custom-del="'+i+'" title="删除">✕</span>';
    h += '</div>';
  }
  h += '<div class="add-btn" id="addCustom">+ 新增字段</div>';
  h += '</div>';

  // ── Dice Panel ──
  h += '<div class="section dice-section"><div class="section-title">二元骰 Duality Dice</div>';
  h += '<div class="dice-bar">';
  h += '  <button class="dice-btn primary" data-quick-roll="plain">掷骰 (2d12)</button>';
  h += '  <button class="dice-btn" data-quick-roll="adv">优势</button>';
  h += '  <button class="dice-btn" data-quick-roll="dis">劣势</button>';
  h += '</div>';
  h += '<div class="dice-mod-row">';
  h += '  <span>调整值</span>';
  h += '  <input id="diceMod" class="dice-mod-input" type="number" value="0"/>';
  h += '  <span style="color:var(--dim);font-size:11px">（属性+经历修正等）</span>';
  h += '</div>';
  h += '</div>';

  h += '</div>'; // .sheet
  el.innerHTML = h;
}

function cellV(label, val, key, rollAttr) {
  var html = '<div class="cell"><span class="cell-label">'+esc(label)+'</span>'
    +'<span class="cell-val" data-edit-key="'+key+'">'+esc(val||'-')+'</span>';
  if (rollAttr) {
    html += '<button class="attr-roll-btn" data-roll-attr="'+rollAttr+'">掷骰</button>';
  }
  html += '</div>';
  return html;
}

function equipBlock(prefix, label) {
  var nameK = prefix + 'WeaponNameTextbox';
  var trait = a(prefix + 'WeaponTraitTextbox');
  return '<div class="equip-block">'
    + '  <div class="equip-title" data-edit-key="'+nameK+'">'+esc(label + ': ' + (a(nameK) || '(无)'))+'</div>'
    + '  <div class="equip-line" data-edit-key="'+prefix+'WeaponStatTextbox">属性: '+esc(a(prefix+'WeaponStatTextbox')||'-')+'</div>'
    + '  <div class="equip-line" data-edit-key="'+prefix+'WeaponDamageTextbox">伤害: '+esc(a(prefix+'WeaponDamageTextbox')||'-')+'</div>'
    + (trait ? '  <div class="equip-line" data-edit-key="'+prefix+'WeaponTraitTextbox">特性: '+esc(trait)+'</div>' : '')
    + '</div>';
}

function armorBlock() {
  var at = a('ArmorTraitTextbox');
  return '<div class="equip-block">'
    + '  <div class="equip-title" data-edit-key="ArmorNameTextbox">'+esc('护甲: ' + (a('ArmorNameTextbox') || '(无)'))+'</div>'
    + '  <div class="equip-line" data-edit-key="ArmorThresholdTextbox">阈值: '+esc(a('ArmorThresholdTextbox')||'-')+'</div>'
    + '  <div class="equip-line" data-edit-key="ArmorScoreTextbox">护甲值: '+esc(a('ArmorScoreTextbox')||'-')+'</div>'
    + (at ? '  <div class="equip-line" data-edit-key="ArmorTraitTextbox">特性: '+esc(at)+'</div>' : '')
    + '</div>';
}

function resRow(label, resId, cls) {
  var keys = RES_KEYS[resId];
  var cur = an(keys.cur);
  var max = an(keys.max);
  if (max <= 0) {
    if (resId === 'armor') max = num(a('ArmorScoreTextbox')) || 0;
    else if (resId === 'hope') max = 6;
    else max = 6;
  }
  return '<div class="res-row '+cls+'" style="margin-bottom:4px">'
    +'<span class="res-label">'+esc(label)+'</span>'
    +'<button class="res-btn" data-res-delta="'+resId+':-1">−</button>'
    +'<span class="res-val" data-edit-key="'+keys.cur+'">'+cur+'</span>'
    +'<span style="color:var(--dim)">/</span>'
    +'<span class="res-val" data-edit-key="'+keys.max+'">'+max+'</span>'
    +'<button class="res-btn" data-res-delta="'+resId+':1">+</button>'
    +'</div>';
}

function goldCell(icon, label, key) {
  return '<div class="gold-row">'
    +'<span class="gold-icon">'+icon+'</span>'
    +'<span class="gold-label">'+esc(label)+'</span>'
    +'<span class="gold-val" data-edit-key="'+key+'">'+esc(an(key))+'</span>'
    +'</div>';
}

/* ================================================================
   4. Inline editing
   ================================================================ */
function startEdit(el, key) {
  if (el.dataset.editing === '1') return;
  var cur = a(key);
  var isMultiline = cur.indexOf('\n') >= 0 || key === INFO_KEYS.classFeature || key === INFO_KEYS.itemSlot;
  var tag = isMultiline ? 'textarea' : 'input';
  var inp = document.createElement(tag);
  inp.className = 'inline-edit';
  inp.value = cur;
  if (!isMultiline) {
    inp.style.width = Math.max(el.offsetWidth + 20, 40) + 'px';
  } else {
    inp.style.width = '100%';
    inp.style.minHeight = '60px';
  }
  el.textContent = '';
  el.appendChild(inp);
  el.dataset.editing = '1';
  inp.focus();
  if (!isMultiline) inp.select();

  var commit = function() {
    var v = inp.value;
    var patch = {}; patch[key] = v;
    patchAttrs(patch);
  };
  var cancel = function() { render(); };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', function(e) {
    if (!isMultiline && e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  inp.addEventListener('click', function(e){ e.stopPropagation(); });
}

/* ================================================================
   5. Duality Dice Engine
   ================================================================ */
function rollDualityDice(advDis, extraMod) {
  var hope = randInt(1,12);
  var fear = randInt(1,12);
  var advVal = 0, advText = '';
  
  if (advDis === 'adv') {
    var d = randInt(1,6);
    advVal = d;
    advText = '优势骰: +' + d;
  } else if (advDis === 'dis') {
    var d = randInt(1,6);
    advVal = -d;
    advText = '劣势骰: -' + d;
  }

  var total = hope + fear + advVal + num(extraMod);
  var outcome; // 'hope' | 'fear' | 'crit'
  if (hope === fear) outcome = 'crit';
  else if (hope > fear) outcome = 'hope';
  else outcome = 'fear';

  return {
    hope: hope, fear: fear,
    advDis: advDis, advVal: advVal, advText: advText,
    modifier: num(extraMod), total: total, outcome: outcome
  };
}

function applyDiceResult(r) {
  var patch = {};
  if (r.outcome === 'hope') {
    // 希望点 +1
    var hk = RES_KEYS.hope;
    var cur = an(hk.cur);
    var max = an(hk.max);
    if (max <= 0) max = 6;
    patch[hk.cur] = clamp(cur + 1, 0, max);
  } else if (r.outcome === 'crit') {
    // 关键成功: 希望点 +1, 压力点 -1
    var hk = RES_KEYS.hope;
    var cur = an(hk.cur);
    var max = an(hk.max);
    if (max <= 0) max = 6;
    patch[hk.cur] = clamp(cur + 1, 0, max);
    var sk = RES_KEYS.stress;
    var sc = an(sk.cur);
    patch[sk.cur] = clamp(sc - 1, 0, 999);
  }
  // fear outcome: no player-side attrs change

  if (Object.keys(patch).length > 0) patchAttrs(patch);
}

function buildRollPayload(r, sourceLabel) {
  return {
    version: 1,
    system: 'daggerheart',
    type: 'duality-roll-result',
    source: sourceLabel || '',
    outcome: r.outcome,
    hope: r.hope,
    fear: r.fear,
    modifier: r.modifier,
    advantageMode: r.advDis || '',
    advantageValue: r.advVal,
    total: r.total,
    effects: {
      playerHopeDelta: r.outcome === 'hope' || r.outcome === 'crit' ? 1 : 0,
      playerStressDelta: r.outcome === 'crit' ? -1 : 0,
      gmFearDelta: r.outcome === 'fear' ? 1 : 0
    }
  };
}

function sendRollEvent(r, sourceLabel) {
  var payload = buildRollPayload(r, sourceLabel);
  window.sealchat.roll('__DAGGERHEART_ROLL_RESULT__ {payload}', sourceLabel || '二元骰掷骰', {
    payload: JSON.stringify(payload)
  });
}

function doRoll(advDis) {
  var modEl = document.getElementById('diceMod');
  var mod = modEl ? num(modEl.value) : 0;
  var r = rollDualityDice(advDis, mod);
  applyDiceResult(r);
  sendRollEvent(r, '二元骰掷骰');
}

/* ── Roll modal for experience-based rolls ── */
var _pendingExpMod = 0;
var _pendingExpLabel = '';

function openRollModal(label, mod) {
  _pendingExpLabel = label;
  _pendingExpMod = num(mod);
  document.getElementById('modalTitle').textContent = label + ' (修正' + (num(mod)>=0?'+':'') + num(mod) + ')';
  document.getElementById('modalMod').value = _pendingExpMod;
  document.getElementById('rollModal').classList.add('active');
}

window.closeRollModal = function() {
  document.getElementById('rollModal').classList.remove('active');
};

window.execRoll = function(advDis) {
  var extraMod = num(document.getElementById('modalMod').value);
  var r = rollDualityDice(advDis, extraMod);
  applyDiceResult(r);
  sendRollEvent(r, _pendingExpLabel || '二元骰掷骰');
  closeRollModal();
};

/* ================================================================
   6. Event delegation
   ================================================================ */
document.addEventListener('click', function(e) {
  var t = e.target;

  // ── inline edit for data-edit-key ──
  var editEl = t.closest('[data-edit-key]');
  if (editEl && editEl.dataset.editing !== '1') {
    startEdit(editEl, editEl.dataset.editKey);
    return;
  }

  // ── resource +/- ──
  var resDelta = t.closest('[data-res-delta]');
  if (resDelta) {
    var parts = resDelta.dataset.resDelta.split(':');
    var resId = parts[0], delta = num(parts[1]);
    var keys = RES_KEYS[resId];
    var cur = an(keys.cur), max = an(keys.max);
    if (max <= 0) {
      if (resId === 'armor') max = num(a('ArmorScoreTextbox')) || 0;
      else if (resId === 'hope') max = 6;
      else max = 6;
    }
    var patch = {};
    patch[keys.cur] = clamp(cur + delta, 0, max);
    patchAttrs(patch);
    return;
  }

  // ── attribute roll ──
  var attrRoll = t.closest('[data-roll-attr]');
  if (attrRoll) {
    var attrId = attrRoll.dataset.rollAttr;
    var attrLabel = ATTR_LABELS[attrId] || attrId;
    var attrMod = an(ATTR_KEYS[attrId]);
    openRollModal(attrLabel, attrMod);
    return;
  }

  // ── experience roll ──
  var expRoll = t.closest('[data-roll-exp]');
  if (expRoll) {
    var idx = expRoll.dataset.rollExp;
    var eName = a('Experience'+idx+'Textbox') || '经历'+idx;
    var eMod = a('Experience'+idx+'ModifierTextbox');
    openRollModal(eName, eMod);
    return;
  }

  // ── quick dice roll ──
  var quickRoll = t.closest('[data-quick-roll]');
  if (quickRoll) {
    var mode = quickRoll.dataset.quickRoll;
    doRoll(mode === 'plain' ? '' : mode);
    return;
  }

  // ── custom field edit ──
  var customEl = t.closest('[data-custom-idx]');
  if (customEl && customEl.dataset.editing !== '1') {
    var ci = num(customEl.dataset.customIdx);
    var part = customEl.dataset.customPart; // 'key' or 'val'
    var cfs = getCustomFields();
    if (ci >= cfs.length) return;
    var oldVal = part === 'key' ? (cfs[ci].k||'') : (cfs[ci].v||'');
    // inline edit
    var inp = document.createElement('input');
    inp.className = 'inline-edit';
    inp.value = oldVal;
    inp.style.width = Math.max(customEl.offsetWidth + 20, 60) + 'px';
    customEl.textContent = '';
    customEl.appendChild(inp);
    customEl.dataset.editing = '1';
    inp.focus(); inp.select();
    var commit = function() {
      cfs[ci][part === 'key' ? 'k' : 'v'] = inp.value;
      var patch = {}; patch[CUSTOM_KEY] = JSON.stringify(cfs);
      patchAttrs(patch);
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
      if (ev.key === 'Escape') { ev.preventDefault(); render(); }
    });
    inp.addEventListener('click', function(ev){ ev.stopPropagation(); });
    return;
  }

  // ── custom field delete ──
  var delEl = t.closest('[data-custom-del]');
  if (delEl) {
    var ci = num(delEl.dataset.customDel);
    var cfs = getCustomFields();
    if (ci < cfs.length) {
      cfs.splice(ci, 1);
      var patch = {}; patch[CUSTOM_KEY] = JSON.stringify(cfs);
      patchAttrs(patch);
    }
    return;
  }

  // ── add custom field ──
  if (t.id === 'addCustom') {
    var cfs = getCustomFields();
    cfs.push({ k: '新字段', v: '' });
    var patch = {}; patch[CUSTOM_KEY] = JSON.stringify(cfs);
    patchAttrs(patch);
    return;
  }

  // ── close roll modal overlay ──
  if (t.id === 'rollModal') {
    closeRollModal();
  }
});

/* ================================================================
   7. Init / onUpdate — import compat
   ================================================================ */
function initDefaults(attrs) {
  // Ensure resource cur/max exist
  var defs = {};
  // HP: map from existing HpSlotCheckbox system to numeric
  if (attrs.HpCurrent == null) {
    // try counting from checkbox system: 0=empty, 1=checked, 2=disabled
    var hp = 0, hpMax = 0;
    for (var i = 1; i <= 12; i++) {
      var v = num(attrs['HpSlotCheckbox'+i]);
      if (v !== 2) { hpMax++; if (v === 1) hp++; }
    }
    if (hpMax > 0) { defs.HpCurrent = hp; defs.HpMax = hpMax; }
    else { defs.HpCurrent = 0; defs.HpMax = 6; }
  }
  if (attrs.StressCurrent == null) {
    var s = 0, sMax = 0;
    for (var i = 1; i <= 12; i++) {
      var v = num(attrs['StressSlotCheckbox'+i]);
      if (v !== 2) { sMax++; if (v === 1) s++; }
    }
    if (sMax > 0) { defs.StressCurrent = s; defs.StressMax = sMax; }
    else { defs.StressCurrent = 0; defs.StressMax = 6; }
  }
  if (attrs.ArmorCurrent == null) {
    var aMax = num(attrs.ArmorTextbox);
    defs.ArmorCurrent = aMax;
    if (!attrs.ArmorTextbox) { defs.ArmorTextbox = '0'; defs.ArmorCurrent = 0; }
  }
  if (attrs.HopeCurrent == null) {
    var h = 0, hMax = 0;
    for (var i = 1; i <= 6; i++) {
      var v = num(attrs['HopeSlotCheckbox'+i]);
      if (v !== 2) { hMax++; if (v === 1) h++; }
    }
    if (hMax > 0) { defs.HopeCurrent = h; defs.HopeMax = hMax; }
    else { defs.HopeCurrent = 2; defs.HopeMax = 6; }
  }
  // Gold: map from checkbox to numeric
  if (attrs.GoldHandful == null) {
    var g = 0;
    for (var i = 1; i <= 9; i++) { if (num(attrs['HandfulGoldCheckbox'+i]) === 1) g++; }
    defs.GoldHandful = g;
  }
  if (attrs.GoldBag == null) {
    var g = 0;
    for (var i = 1; i <= 9; i++) { if (num(attrs['BagGoldCheckbox'+i]) === 1) g++; }
    defs.GoldBag = g;
  }
  if (attrs.GoldChest == null) {
    var g = 0;
    if (num(attrs['ChestGoldCheckbox1']) === 1) g++;
    defs.GoldChest = g;
  }

  // Apply defaults
  for (var k in defs) {
    if (attrs[k] == null) attrs[k] = defs[k];
  }
  return attrs;
}

window.sealchat.onUpdate(function(data) {
  S.name = (data && data.name) || '';
  S.avatarUrl = (data && data.avatarUrl) || '';
  var nextAttrs = {};
  var oldAttrs = S.attrs || {};
  var incomingAttrs = (data && data.attrs) || {};
  for (var key in oldAttrs) nextAttrs[key] = oldAttrs[key];
  for (var key in incomingAttrs) nextAttrs[key] = incomingAttrs[key];
  S.attrs = initDefaults(nextAttrs);
  render();
});
</script>
